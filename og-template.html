<!DOCTYPE html>
<!--
  Plantilla de images/og-image.jpg (1200x630). No se publica como página (robots/sitemap no la enlazan).
  Regenerar: abrir en Chrome headless a 1200x630 y guardar como JPG (ver PR de marca fase 3).
  Colores: bloque de marca de tokens.css (grafito + oro). Sin capturas: se rehacen con la UI 3.3.0.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: var(--font-body);
    background: linear-gradient(180deg, var(--brand-graphite-top) 0%, var(--brand-graphite-bottom) 100%);
    color: #FFFFFF;
    position: relative;
  }
  .content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100%;
    padding: 0 104px 0 96px;
  }
  .logotipo { display: block; height: 34px; width: auto; margin-bottom: 40px; }
  h1 {
    font-family: var(--font-heading);
    font-size: 52px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1.2px;
    margin-bottom: 20px;
  }
  .subtitle {
    font-family: var(--font-heading);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--brand-gold-top);
    margin-bottom: 38px;
  }
  .facts {
    display: flex;
    gap: 12px;
  }
  .fact {
    font-size: 17px;
    font-weight: 500;
    color: var(--brand-gold-top);
    border: 1.5px solid rgba(184, 153, 95, 0.45);
    padding: 8px 18px;
    border-radius: 999px;
  }
  .simbolo { display: block; height: 400px; width: auto; }
  .domain {
    position: absolute;
    bottom: 36px;
    right: 104px;
    font-size: 17px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.5);
  }
</style>
</head>
<body>
  <div class="content">
    <div class="text-side">
      <img class="logotipo" src="images/brand/logotipo-oro.svg" alt="Silaro">
      <h1>Your scent is the<br>first thing people<br>remember about you.</h1>
      <p class="subtitle">Make every choice count.</p>
      <div class="facts">
        <span class="fact">78,000 perfumes</span>
        <span class="fact">19 languages</span>
        <span class="fact">iOS &amp; Android</span>
      </div>
    </div>
    <img class="simbolo" src="images/brand/simbolo-dark.svg" alt="">
  </div>
  <div class="domain">silaro.app</div>
</body>
</html>
